services:
  - type: web
    name: bookmark-file-manager-demo
    runtime: node
    plan: free
    branch: master
    # express, vite and sharp live in devDependencies, which Render skips by default
    buildCommand: npm install --include=dev && npm run build:demo
    # Full read-write so visitors can try uploads; the free plan's /tmp is
    # wiped whenever the instance restarts, so the demo tree resets by itself.
    startCommand: node server/standalone.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FM_HOST
        value: 0.0.0.0
      - key: FM_ROOT
        value: /tmp/storage
