  <script>
    var fileSystem = [
      {
        name: "Documents",
        isDirectory: true,
        items: [
          {
            name: "Projects",
            isDirectory: true,
            items: [
              {
                name: "About.rtf",
                isDirectory: false,
                size: 1024
              },
              {
                name: "Passwords.rtf",
                isDirectory: false,
                size: 2048
              }
            ]
          },
          {
            name: "About.xml",
            isDirectory: false,
            size: 1024
          },
          {
            name: "Managers.rtf",
            isDirectory: false,
            size: 2048
          },
          {
            name: "ToDo.txt",
            isDirectory: false,
            size: 3072
          },
          {
            name: "Images",
            isDirectory: true,
            items: [
              {
                name: "logo.png",
                isDirectory: false,
                size: 20480
              },
              {
                name: "banner.gif",
                isDirectory: false,
                size: 10240
              }
            ]
          },
          {
            name: "System",
            isDirectory: true,
            items: [
              {
                name: "Employees",
                isDirectory: true,
                items: []
              },
              {
                name: "Employees.txt",
                isDirectory: false,
                size: 3072
              },
              {
                name: "PasswordList.txt",
                isDirectory: false,
                size: 5120
              }
            ]
          },
          {
            name: "Description.rtf",
            isDirectory: false,
            size: 1024
          },
          {
            name: "Description.txt",
            isDirectory: false,
            size: 2048
          }
        ],
      }
    ];



    //Побудова топології
    function buildFileSystemTree(fileSystem, parentElement) {
      var ul = document.createElement('ul');

      fileSystem.forEach(function (item) {
        if (item.isDirectory) {
          var li = document.createElement('li');
          li.classList.add('folder');
          li.classList.add('my-1');

          var toggleIcon = document.createElement('span');
          toggleIcon.classList.add('toggle-icon');
          toggleIcon.innerHTML = '<i class="bi bi-caret-right-fill pe-1"></i>';
          li.appendChild(toggleIcon);

          var folderIcon = document.createElement('span');
          folderIcon.classList.add('folder-icon');
          folderIcon.innerHTML = '<i class="bi bi-folder"></i>';
          li.appendChild(folderIcon);

          var nameSpan = document.createElement('span');
          nameSpan.innerText = item.name;
          li.appendChild(nameSpan);

          if (item.items && item.items.length > 0) {
            buildFileSystemTree(item.items, li);
          }

          ul.appendChild(li);
        }
      });

      parentElement.appendChild(ul);
    }


    // Використання функції
    var folderTree = document.getElementById('folder-tree');
    buildFileSystemTree(fileSystem, folderTree);

    // Відкриття першої теки в топології за замовчуванням
    var firstLevelFolder = folderTree.querySelector('.folder');
    var toggleIcon = firstLevelFolder.querySelector('.toggle-icon');
    var subfolders = firstLevelFolder.querySelector('ul');
    if (subfolders) {
      firstLevelFolder.classList.add('open');
      toggleIcon.innerHTML = '<i class="bi bi-caret-down-fill pe-1"></i>';
      firstLevelFolder.querySelector('.folder-icon').innerHTML = '<i class="bi bi-folder2-open"></i>';
    }

    // Топологія
    document.addEventListener('DOMContentLoaded', function () {
      var toggleIcons = document.querySelectorAll('.toggle-icon');
      toggleIcons.forEach(function (icon) {
        icon.addEventListener('click', function () {
          var folder = this.parentNode;
          var subfolders = folder.querySelectorAll('.folder');
          subfolders.forEach(function (subfolder) {
            subfolder.classList.remove('open');
            subfolder.querySelector('.toggle-icon').innerHTML = '<i class="bi bi-caret-right-fill pe-1"></i>';
            subfolder.querySelector('.folder-icon').innerHTML = '<i class="bi bi-folder"></i>';
          });
          if (folder.classList.contains('open')) {
            folder.classList.remove('open');
            this.innerHTML = '<i class="bi bi-caret-right-fill pe-1"></i>';
            folder.querySelector('.folder-icon').innerHTML = '<i class="bi bi-folder"></i>';
          } else {
            folder.classList.add('open');
            this.innerHTML = '<i class="bi bi-caret-down-fill pe-1"></i>';
            folder.querySelector('.folder-icon').innerHTML = '<i class="bi bi-folder2-open"></i>';
          }
        });
      });

      // Відстеження натискання на ім’я теки в топології та показ вмісту
      var folderNames = document.querySelectorAll('.folder span:not(.toggle-icon)');
      var fsPanel = document.getElementById('fs-panel');

      folderNames.forEach(function (folderName) {
        folderName.addEventListener('click', function (event) {
          event.stopPropagation(); // Зупинка спливання події

          var selectedFolder = this.parentNode;
          var selectedName = this.innerText;

          // Перевіряємо, чи розгорнуто теку
          var isExpanded = selectedFolder.classList.contains('open');

          // Знімаємо виділення з усіх тек
          var allFolders = document.querySelectorAll('.folder');
          allFolders.forEach(function (folder) {
            folder.classList.remove('selected');
          });

          // Додаємо виділення вибраній теці
          selectedFolder.classList.add('selected');

          // Якщо теку не розгорнуто, додаємо клас 'open' і міняємо іконку
          if (!isExpanded) {
            selectedFolder.classList.add('open');
            selectedFolder.querySelector('.toggle-icon').innerHTML = '<i class="bi bi-caret-down-fill pe-1"></i>';
            selectedFolder.querySelector('.folder-icon').innerHTML = '<i class="bi bi-folder2-open"></i>';
          }

          // Показуємо вміст теки в елементі з id="fs-panel"
          var folderContent = getFolderContent(selectedName);
          fsPanel.innerHTML = folderContent;
        });
      });

      // Функція для отримання вмісту теки
      function getFolderContent(folderName) {
        var folderContent = '';

        // Шукаємо теку в масиві fileSystem
        var folder = findFolder(fileSystem, folderName);

        // Якщо теку знайдено, отримуємо вміст
        if (folder) {
          folderContent += '<div class="fs-filemanager-thumbnails-item" title="Ім’я файлу: ' + folder.name + ' Шлях: undefined Дата зміни: ' + new Date().toString() + '">';
          folderContent += '<div class="fs-filemanager-thumbnails-item-content">';
          folderContent += '<img src="https://js.devexpress.com/Demos/WidgetsGallery/JSDemos/images/thumbnails/folder.svg" class="dx-icon dx-filemanager-thumbnails-item-thumbnail dx-filemanager-item-custom-thumbnail">';
          folderContent += '<div class="dx-filemanager-thumbnails-item-spacer"></div>';
          folderContent += '<div class="fs-filemanager-thumbnails-item-name">..</div>';
          folderContent += '</div>';
          folderContent += '</div>';

          if (folder.items && folder.items.length > 0) {
            folder.items.forEach(function (item) {
              if (item.isDirectory) {
                folderContent += '<div class="fs-filemanager-thumbnails-item" title="Ім’я файлу: ' + item.name + ' Шлях: undefined Дата зміни: ' + new Date().toString() + '">';
                folderContent += '<div class="fs-filemanager-thumbnails-item-content">';
                folderContent += '<img src="https://js.devexpress.com/Demos/WidgetsGallery/JSDemos/images/thumbnails/folder.svg" class="dx-icon dx-filemanager-thumbnails-item-thumbnail dx-filemanager-item-custom-thumbnail">';
                folderContent += '<div class="dx-filemanager-thumbnails-item-spacer"></div>';
                folderContent += '<div class="fs-filemanager-thumbnails-item-name">' + item.name + '</div>';
                folderContent += '</div>';
                folderContent += '</div>';
              } else {
                folderContent += '<div class="dx-filemanager-thumbnails-item" title="Ім’я файлу: ' + item.name + ' Тип: ' + getFileExtension(item.name) + ' Розмір: ' + item.size + ' B Шлях: undefined Дата зміни: ' + new Date().toString() + '">';
                folderContent += '<div class="fs-filemanager-thumbnails-item-content">';
                folderContent += '<img src="./image/' + getFileExtension(item.name) + '.svg" class="fs-icon dx-filemanager-thumbnails-item-thumbnail dx-filemanager-item-custom-thumbnail">';
                folderContent += '<div class="dx-filemanager-thumbnails-item-spacer"></div>';
                folderContent += '<div class="fs-filemanager-thumbnails-item-name">' + item.name + '</div>';
                folderContent += '</div>';
                folderContent += '</div>';
              }
            });
          }
        }

        return folderContent;
      }

      // Функція для пошуку теки в масиві fileSystem
      function findFolder(fileSystem, folderName) {
        for (var i = 0; i < fileSystem.length; i++) {
          var item = fileSystem[i];
          if (item.name === folderName && item.isDirectory) {
            return item;
          } else if (item.items && item.items.length > 0) {
            var subfolder = findFolder(item.items, folderName);
            if (subfolder) {
              return subfolder;
            }
          }
        }
        return null;
      }

      // Функція для отримання розширення файлу
      function getFileExtension(filename) {
        return filename.split('.').pop();
      }

    });

  </script>
